<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #mapa-prueba { height: 400px; width: 100%; }
    </style>
</head>
<body>
    <h3>Prueba de Mapa</h3>
    <div id="mapa-prueba"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('mapa-prueba').setView([13.7942, -88.8965], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        L.marker([13.7942, -88.8965]).addTo(map).bindPopup("¡Funciona!");
    </script>
</body>
</html>
