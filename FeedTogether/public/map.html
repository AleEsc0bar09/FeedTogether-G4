<h3 class="fw-bold mb-3">Coverage Map</h3>
<div class="row">
  <div class="col-lg-8">
    <div class="map-placeholder bg-light rounded-4 border d-flex flex-column align-items-center justify-content-center p-5 text-center position-relative">
      <i class="bi bi-map display-1 text-primary mb-3"></i>
      <p class="fw-bold">Interactive Region Map</p>
      
      <div class="map-tooltip bg-white p-3 rounded-3 shadow border text-start">
        <h6 class="fw-bold mb-1">El Rosario Center</h6>
        <p class="small text-muted mb-1">San Miguel</p>
        <p class="small mb-2"><strong>130</strong> Beneficiaries</p>
        <button class="btn btn-sm btn-success w-100" onclick="loadSection('details')">View Request</button>
      </div>
    </div>
    <div class="row g-2 mt-3">
      <div class="col-6">
        <select class="form-select"><option>All Regions</option></select>
      </div>
      <div class="col-6">
        <select class="form-select"><option>All Districts</option></select>
      </div>
    </div>
  </div>
  <div class="col-lg-4 mt-4 mt-lg-0">
    <div class="card border-0 shadow-sm p-3">
      <h5 class="fw-bold mb-3">Priority Level</h5>
      <div class="d-flex align-items-center mb-2">
        <span class="badge rounded-circle bg-danger me-2 p-2"> </span>
        <span>High Priority</span>
      </div>
      <div class="d-flex align-items-center mb-2">
        <span class="badge rounded-circle bg-warning me-2 p-2"> </span>
        <span>Medium Priority</span>
      </div>
      <div class="d-flex align-items-center">
        <span class="badge rounded-circle bg-success me-2 p-2"> </span>
        <span>Low Priority</span>
      </div>
    </div>
  </div>
</div>
