<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedTogether</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>
<body>
<div class="p-3 bg-warning text-dark rounded-3 mb-4">
  <h3 class="fw-bold mb-0">Stories of Impact</h3>
</div>

<div class="vstack gap-4">
  <div class="card border-0 shadow-sm p-3">
    <div class="row align-items-center">
      <div class="col-md-4">
        <img src="img/Story1.jpg" class="img-fluid rounded-3 object-fit-cover w-100" style="height: 180px;" alt="image about Ana's situation">
      </div>
      <div class="col-md-8 mt-3 mt-md-0">
        <h4 class="fw-bold">Anna's diet: bananas, chipilín soup, izote flower.</h4>
        <p class="text-muted">Resilience in the Mountains of Usulután: Overcoming Food Insecurity.</p>
        <button class="btn btn-success btn-sm px-3 py-2 fw-semibold" onclick="loadStoryDetail('anna-usulutan')">
          Read Full Story
        </button>
      </div>
    </div>
  </div>
  <div class="card border-0 shadow-sm p-3">
    <div class="row align-items-center">
      <div class="col-md-4">
        <img src="img/Story2.jpg" class="img-fluid rounded-3 object-fit-cover w-100" style="height: 180px;" alt="Image about pots">
      </div>
      <div class="col-md-8 mt-3 mt-md-0">
        <h4 class="fw-bold">Maura has stopped eating once a day</h4>
        <p class="text-muted">Maura doesn't manage to make more than 20 dollars a month.</p>
        <button class="btn btn-success btn-sm px-3 py-2 fw-semibold" onclick="loadStoryDetail('maura-tacuba')">
          Read Full Story
        </button>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/scripts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
