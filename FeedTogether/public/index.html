<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedTogether</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <body>
    <nav
      class="navbar navbar-expand-lg bg-white custom-navbar border-bottom shadow-sm py-2"
      <div class="container">
        
         <a class="navbar-brand d-flex align-items-center gap-2"
          href="#"
          onclick="loadSection('home')"
        >
          <img
            src="img/horizontal_logo.png"
            alt="FeedTogether Logo"
            class="brand-logo"
            style="height: 70px; width: auto"
          />
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center gap-lg-3" id="navbarLinks">
            <li class="nav-item" data-rol="guest">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('request')">Requests</a>
            </li>
            <li class="nav-item" data-rol="guest,donor">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('volunteer')">Volunteering</a>
            </li>
            <li class="nav-item" data-rol="guest,requester">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('stories')">Stories</a>
            </li>
            <li class="nav-item" data-rol="guest,donor,requester">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('map')">Needs Map</a>
            </li>
            <li class="nav-item" data-rol="guest">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('About Us')">About Us</a>
            </li>

            <!-- Solo para donor -->
            <li class="nav-item" data-rol="donor">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('mydonations')">My Donations</a>
            </li>

            <!-- Solo para requester -->
            <li class="nav-item" data-rol="requester">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('myrequest')">My Requests</a>
            </li>
            <li class="nav-item" data-rol="requester">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('requestcreation')">New Request</a>
            </li>

            <!-- Solo para donor o requester -->
            <li class="nav-item" data-rol="donor,requester">
              <a class="nav-link fw-semibold" href="#" onclick="loadSection('profile')">My Profile</a>
            </li>

            <!-- Login: solo si NO hay sesión -->
            <li class="nav-item ms-lg-2" data-rol="guest" id="loginNavItem">
              <a class="btn btn-login-nav text-white fw-bold px-3 py-1" href="#" onclick="loadSection('login')">Login</a>
            </li>

            <!-- Logout: solo si SÍ hay sesión -->
            <li class="nav-item ms-lg-2" data-rol="donor,requester" id="logoutNavItem" style="display:none;">
              <a class="btn btn-login-nav text-white fw-bold px-3 py-1" href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </li>
          </ul>
        </div>
      </div>
