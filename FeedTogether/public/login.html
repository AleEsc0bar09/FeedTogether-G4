<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedTogether</title>
        <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm p-4 text-center">
      <img src="img/logo.png" 
      class="img-fluid mx-auto d-block mb-3" style="max-width: 120px;" 
      alt="FeedTogether Logo">
      <h3 class="fw-bold">Welcome Back</h3>
      <p class="text-muted small mb-4">Sign in to continue making an impact.</p>
      <form onsubmit="event.preventDefault(); loginAs('donor');">
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold">Email address</label>
          <input type="email" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Sign In</button>
      </form>
      <p class="mt-3 small mb-0">Don't have an account? <a href="#" class="text-warning fw-bold text-decoration-none" onclick="loadSection('roles')">Register</a></p>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/scripts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
