<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedTogether</title>
      <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

<h3 class="fw-bold"></i> Volunteering Opportunities</h3>
<p class="text-muted small mb-4">Explore events organized by community partners</p>

<div class="row g-2 mb-4">
  <div class="col-md-4">
    <select class="form-select">
      <option>All Categories</option>
    </select>
  </div>
  <div class="col-md-4">
    <select class="form-select">
      <option>All Dates</option>
    </select>
  </div>
</div>

<div class="card border-0 shadow-sm p-3">
  <div class="row align-items-center">
    <div class="col-md-4">
      <img src="img/Volunteering one.jpg" class="img-fluid rounded-3" alt="Volunteering">
    </div>
    <div class="col-md-8 mt-3 mt-md-0">
      <h4 class="fw-bold mb-1">Food Sorting & Packaging Workshop</h4>
      <p class="text-muted small mb-2">Organized by: National Food Alliance</p>
      <p class="mb-1"><i class="bi bi-calendar"></i> June 25, 2026 | <i class="bi bi-clock"></i> 8:00 AM - 12:00 PM</p>
      <p class="mb-3"><i class="bi bi-geo-alt"></i> Main Warehouse</p>
      <p class="small text-secondary">Assist in organizing donated pantry items for distribution to regional centers.</p>
      <button class="btn btn-success btn-sm">Learn More</button>
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/scripts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
