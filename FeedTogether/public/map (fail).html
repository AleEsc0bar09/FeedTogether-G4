<h3 class="fw-bold mb-3">Coverage Map</h3>
<div class="row">
  <div class="col-lg-8">
    <div id="map" class="rounded-4 border shadow-sm" style="height: 450px; width: 100%;"></div>
    
    <div class="row g-2 mt-3">
      <div class="col-6"><select class="form-select"><option>All Regions</option></select></div>
      <div class="col-6"><select class="form-select"><option>All Districts</option></select></div>
    </div>
  </div>
  
  <div class="col-lg-4 mt-4 mt-lg-0">
    <div class="card border-0 shadow-sm p-3">
      <h5 class="fw-bold mb-3">Priority Level</h5>
      <div class="d-flex align-items-center mb-2"><span class="badge rounded-circle bg-danger me-2 p-2"> </span><span>High Priority</span></div>
      <div class="d-flex align-items-center mb-2"><span class="badge rounded-circle bg-warning me-2 p-2"> </span><span>Medium Priority</span></div>
      <div class="d-flex align-items-center"><span class="badge rounded-circle bg-success me-2 p-2"> </span><span>Low Priority</span></div>
    </div>
  </div>
</div>
