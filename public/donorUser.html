<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

  <nav class="navbar navbar-expand-lg bg-white custom-navbar border-bottom shadow-sm py-2">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand d-flex align-items-center gap-2 m-0 p-0" href="#" onclick="loadSection('homeDonor')">
      <img src="img/horizontal_logo.png" alt="FeedTogether Logo" class="brand-logo" style="height: 70px; width: auto; display: block;">
    </a>

    <div class="dropdown me-2 me-md-0">
      <span id="perfil-icono-wrapper" class="dropdown-toggle d-flex align-items-center justify-content-center" data-bs-toggle="dropdown" aria-expanded="false" style="width: 40px; height: 40px; cursor: pointer;">

      </span>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
        <li>
          <a class="dropdown-item" href="#" onclick="loadSection('profile')">
            <i class="bi bi-person me-2"></i> Ver perfil
          </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item" href="#" onclick="logoutUser()">
            <i class="bi bi-box-arrow-right me-2"></i> Log out
          </a>
        </li>
      </ul>
    </div>
  </div>

  <main id="main-content" class="container py-4"></main>

  <footer class="text-white text-center py-3 mt-auto">
